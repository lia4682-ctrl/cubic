<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>큐빅 이미지 무료 다운로드</title>
<meta name="description" content="큐빅 이미지를 확인하고 바로 다운로드하세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --frost:#EEF2F7;
  --paper:#FFFFFF;
  --ink:#1A2236;
  --slate:#586178;
  --line:#D3DAE7;
  --accent:#4636C8;
  --accent-deep:#3628A8;
  --accent-soft:#E6E3FA;
  --cut:16px;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-padding-top:88px}
body{
  margin:0;background:var(--frost);color:var(--ink);
  font-family:var(--font);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,a{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- masthead ---------- */
.masthead{
  max-width:1200px;margin:0 auto;padding:56px 24px 28px;
  display:flex;gap:20px;align-items:center;
}
.mark{flex:none;width:64px;height:64px}
.masthead h1{
  margin:0;font-size:clamp(1.9rem,5vw,3.1rem);line-height:1.15;
  font-weight:700;letter-spacing:-.025em;word-break:keep-all;
}
.masthead p{margin:8px 0 0;color:var(--slate);max-width:52ch;word-break:keep-all}

/* ---------- toolbar ---------- */
.toolbar{border-bottom:1px solid var(--line)}
.toolbar-inner{
  max-width:1200px;margin:0 auto;padding:12px 24px;
  display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;
}
.search{
  flex:1 1 220px;max-width:340px;height:42px;padding:0 14px;
  border:1px solid var(--line);border-radius:4px;background:var(--paper);
}
.search::placeholder{color:#7C869B}
.filters{flex:1 1 100%;min-width:0;max-width:100%;display:flex;flex-direction:column;gap:10px;padding-top:4px}
.filters:empty{display:none}
.fgroup{display:flex;gap:14px;align-items:flex-start}
.flabel{flex:none;width:2.4em;padding-top:6px;color:var(--slate);font-size:.875rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip .n{margin-left:6px;font-size:.8rem;opacity:.65}
.chip{
  height:34px;padding:0 14px;border:1px solid var(--line);border-radius:999px;
  background:var(--paper);cursor:pointer;color:var(--slate);
}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.count{margin-left:auto;color:var(--slate);font-size:.9rem;white-space:nowrap}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:42px;padding:0 18px;border:1px solid var(--accent);border-radius:4px;
  background:var(--accent);color:#fff;font-weight:500;cursor:pointer;text-decoration:none;
}
.btn:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.btn:disabled{opacity:.6;cursor:progress}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn svg{width:18px;height:18px;flex:none}

/* ---------- grid ---------- */
main{max-width:1200px;margin:0 auto;padding:28px 24px 120px}
.grid{
  list-style:none;margin:0;padding:0;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;
}
.tile{
  position:relative;aspect-ratio:1;background:var(--paper);
  /* 보석의 면처럼 두 모서리를 깎은 타일 */
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)));
}
.thumb{
  position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;cursor:zoom-in;
  background-color:#fff;
  background-image:conic-gradient(#E9EDF4 25%,transparent 0 50%,#E9EDF4 0 75%,transparent 0);
  background-size:16px 16px;
}
.thumb:focus-visible{outline-offset:-4px}
.thumb img{width:100%;height:100%;object-fit:contain;padding:14px 14px 58px;display:block}
.tile.selected::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 0 4px var(--accent);background:rgba(70,54,200,.08);
}
.pick{
  position:absolute;top:8px;left:8px;z-index:2;
  width:28px;height:28px;display:grid;place-items:center;
  background:var(--paper);border:1px solid var(--line);border-radius:4px;cursor:pointer;
}
.pick input{width:18px;height:18px;margin:0;accent-color:var(--accent);cursor:pointer}
.cap{
  position:absolute;left:0;right:0;bottom:0;z-index:2;
  display:flex;align-items:center;gap:8px;
  padding:10px 10px 10px 22px;background:var(--paper);border-top:1px solid var(--line);
}
.cap .name{flex:1;min-width:0;font-size:.92rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl{
  flex:none;width:36px;height:36px;display:grid;place-items:center;
  border-radius:4px;color:var(--accent);
}
.dl:hover{background:var(--accent-soft)}
.dl svg{width:20px;height:20px}

.empty{
  max-width:52ch;margin:40px auto;padding:28px;background:var(--paper);
  border:1px dashed var(--line);border-radius:6px;color:var(--slate);
}
.empty strong{color:var(--ink)}
.empty code{background:var(--frost);padding:2px 6px;border-radius:3px;font-size:.9em}

footer{max-width:1200px;margin:0 auto;padding:0 24px 48px;color:var(--slate);font-size:.9rem}

/* ---------- selection bar ---------- */
.selbar{
  position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:20;
  width:min(560px,calc(100vw - 32px));
  display:flex;align-items:center;gap:10px;padding:10px 10px 10px 18px;
  background:var(--ink);color:#fff;border-radius:6px;box-shadow:0 8px 28px rgba(26,34,54,.35);
}
.selbar[hidden]{display:none}
.selbar .txt{flex:1;font-weight:500}
.selbar .btn.ghost{color:#fff;border-color:rgba(255,255,255,.4)}
.selbar .btn.ghost:hover{background:rgba(255,255,255,.12)}

/* ---------- viewer ---------- */
dialog{
  width:min(96vw,1000px);max-height:96vh;padding:0;border:0;border-radius:6px;
  background:var(--paper);color:var(--ink);overflow:hidden;
}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(26,34,54,.75)}
.stage{
  position:relative;flex:1;min-height:0;display:grid;place-items:center;
  background-color:#fff;
  background-image:conic-gradient(#E9EDF4 25%,transparent 0 50%,#E9EDF4 0 75%,transparent 0);
  background-size:20px 20px;
}
.stage img{max-width:100%;max-height:68vh;object-fit:contain;display:block;padding:16px}
.nav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:44px;height:44px;display:grid;place-items:center;
  border:1px solid var(--line);border-radius:4px;background:var(--paper);cursor:pointer;
}
.nav:hover{border-color:var(--accent);color:var(--accent)}
.nav.prev{left:12px}.nav.next{right:12px}
.nav svg{width:22px;height:22px}
.vbar{
  display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;
  padding:16px 20px;border-top:1px solid var(--line);
}
.vinfo{min-width:0}
.vinfo h2{margin:0;font-size:1.15rem;line-height:1.3}
.vinfo p{margin:2px 0 0;color:var(--slate);font-size:.9rem}
.vinfo p.vtags{color:var(--accent-deep)}
.vact{display:flex;gap:10px}
.closex{
  position:absolute;top:12px;right:12px;z-index:3;
  width:44px;height:44px;display:grid;place-items:center;
  border:1px solid var(--line);border-radius:4px;background:var(--paper);cursor:pointer;
}
.closex:hover{border-color:var(--accent);color:var(--accent)}
.closex svg{width:20px;height:20px}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:50;
  max-width:min(520px,calc(100vw - 32px));padding:12px 18px;
  background:var(--ink);color:#fff;border-radius:6px;font-size:.95rem;
}
.toast[hidden]{display:none}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:560px){
  .masthead{padding-top:36px;gap:14px}
  .mark{width:48px;height:48px}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .cap{padding-left:18px}
  .count{order:5;margin-left:0}
  .fgroup{flex-direction:column;align-items:stretch;gap:4px;min-width:0;width:100%}
  .flabel{width:auto;padding-top:0}
  .chips{flex-wrap:nowrap;overflow-x:auto;min-width:0;max-width:100%;padding-bottom:4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>

<header class="masthead">
  <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
    <polygon points="32,4 57,18 32,32 7,18" fill="#8B7DF0"/>
    <polygon points="7,18 32,32 32,60 7,46" fill="#3628A8"/>
    <polygon points="57,18 32,32 32,60 57,46" fill="#4636C8"/>
  </svg>
  <div>
    <h1 id="siteTitle">큐빅 이미지 무료 다운로드</h1>
    <p id="siteSub"></p>
  </div>
</header>

<div class="toolbar">
  <div class="toolbar-inner">
    <label class="sr" for="q">이미지 검색</label>
    <input id="q" class="search" type="search" placeholder="제목이나 태그로 검색" autocomplete="off">
    <span class="count" id="count" aria-live="polite"></span>
    <button class="btn" id="zipAll" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
      <span class="lbl">전체 ZIP 받기</span>
    </button>
    <div class="filters" id="filters"></div>
  </div>
</div>

<main>
  <ul class="grid" id="grid"></ul>
  <div class="empty" id="empty" hidden></div>
</main>

<footer id="license"></footer>

<div class="selbar" id="selbar" hidden>
  <span class="txt" id="selTxt"></span>
  <button class="btn ghost" id="selClear" type="button">선택 해제</button>
  <button class="btn" id="selZip" type="button"><span class="lbl">ZIP으로 받기</span></button>
</div>

<dialog id="viewer" aria-labelledby="vTitle">
  <button class="closex" id="vClose" type="button" aria-label="닫기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div class="stage">
    <button class="nav prev" id="vPrev" type="button" aria-label="이전 이미지">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <img id="vImg" alt="">
    <button class="nav next" id="vNext" type="button" aria-label="다음 이미지">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
  <div class="vbar">
    <div class="vinfo">
      <h2 id="vTitle"></h2>
      <p id="vMeta"></p>
      <p id="vTags" class="vtags"></p>
    </div>
    <div class="vact">
      <a class="btn" id="vDl" href="#" download>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
        다운로드
      </a>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<!-- 이미지 목록 (make_manifest.py 가 갱신합니다) -->
<script src="gallery-data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<script>
(function () {
  "use strict";

  var DATA = window.GALLERY || { site: {}, images: [] };
  var SITE = DATA.site || {};
  var IMG_DIR = "images/";
  var THUMB_DIR = "thumbs/";

  var DL_ICON =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>';

  var $ = function (s) { return document.querySelector(s); };
  var grid = $("#grid"), filtersEl = $("#filters"), countEl = $("#count"), emptyEl = $("#empty");
  var qEl = $("#q"), selbar = $("#selbar"), selTxt = $("#selTxt"), toastEl = $("#toast");
  var dlg = $("#viewer"), vImg = $("#vImg"), vTitle = $("#vTitle"), vMeta = $("#vMeta"), vTags = $("#vTags"), vDl = $("#vDl");

  var items = (DATA.images || []).map(function (i) {
    return {
      file: i.file,
      title: i.title || i.file,
      category: i.category || "",
      color: i.color || "",
      tags: i.tags || [],
      url: IMG_DIR + encodeURIComponent(i.file),
      thumbUrl: i.thumb ? THUMB_DIR + encodeURIComponent(i.thumb) : IMG_DIR + encodeURIComponent(i.file)
    };
  });

  var state = { q: "", category: "", color: "", tag: "" };
  var view = [];
  var selected = new Set();
  var cur = 0;
  var toastTimer;

  /* ----- 사이트 문구 ----- */
  if (SITE.title) { $("#siteTitle").textContent = SITE.title; document.title = SITE.title; }
  $("#siteSub").textContent = SITE.subtitle || "";
  $("#license").textContent = SITE.license || "";

  /* ----- 유틸 ----- */
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 5000);
  }

  function saveBlob(blob, name) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }

  function setLabel(btn, text) { btn.querySelector(".lbl").textContent = text; }

  async function makeZip(list, zipName, btn) {
    if (!window.JSZip) {
      toast("ZIP 기능을 불러오지 못했어요. 인터넷 연결을 확인하거나 이미지를 하나씩 받아주세요.");
      return;
    }
    if (!list.length) return;
    var original = btn.querySelector(".lbl").textContent;
    btn.disabled = true;
    try {
      var zip = new JSZip();
      for (var n = 0; n < list.length; n++) {
        setLabel(btn, "준비 중 " + (n + 1) + "/" + list.length);
        var res = await fetch(list[n].url);
        if (!res.ok) throw new Error("HTTP " + res.status + " " + list[n].file);
        zip.file(list[n].file, await res.blob());
      }
      setLabel(btn, "압축 중…");
      var blob = await zip.generateAsync({ type: "blob", compression: "STORE" });
      saveBlob(blob, zipName);
    } catch (err) {
      console.error(err);
      toast(location.protocol === "file:"
        ? "ZIP은 웹에 올린 뒤(또는 로컬 서버에서) 사용할 수 있어요. 이미지를 하나씩 받는 건 지금도 돼요."
        : "ZIP을 만들지 못했어요. 잠시 후 다시 시도해 주세요.");
    } finally {
      btn.disabled = false;
      setLabel(btn, original);
    }
  }

  /* ----- 필터 칩 (종류 / 색상, 없으면 태그) ----- */
  function valuesOf(key) {
    var counts = {}, order = [];
    items.forEach(function (it) {
      var list = key === "tag" ? it.tags : (it[key] ? [it[key]] : []);
      list.forEach(function (v) {
        if (!(v in counts)) { counts[v] = 0; order.push(v); }
        counts[v]++;
      });
    });
    if (key === "color") order.sort(function (a, b) { return counts[b] - counts[a]; });
    if (key === "tag") order.sort(function (a, b) { return a.localeCompare(b, "ko"); });
    return order.map(function (v) { return { v: v, n: counts[v] }; });
  }

  function makeGroup(key, label) {
    var vals = valuesOf(key);
    if (!vals.length) return null;
    var wrap = document.createElement("div");
    wrap.className = "fgroup";
    var lab = document.createElement("span");
    lab.className = "flabel";
    lab.textContent = label;
    var chips = document.createElement("div");
    chips.className = "chips";
    chips.setAttribute("role", "group");
    chips.setAttribute("aria-label", label + "로 필터");
    [{ v: "", n: items.length }].concat(vals).forEach(function (o) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.setAttribute("aria-pressed", String(state[key] === o.v));
      b.appendChild(document.createTextNode(o.v || "전체"));
      var n = document.createElement("span");
      n.className = "n";
      n.textContent = o.n;
      b.appendChild(n);
      b.addEventListener("click", function () {
        state[key] = o.v;
        chips.querySelectorAll(".chip").forEach(function (c) {
          c.setAttribute("aria-pressed", String(c === b));
        });
        render();
      });
      chips.appendChild(b);
    });
    wrap.appendChild(lab);
    wrap.appendChild(chips);
    return wrap;
  }

  function buildFilters() {
    filtersEl.replaceChildren();
    var groups = [makeGroup("category", "종류"), makeGroup("color", "색상")].filter(Boolean);
    if (!groups.length) groups = [makeGroup("tag", "태그")].filter(Boolean);
    groups.forEach(function (g) { filtersEl.appendChild(g); });
  }

  /* ----- 그리드 ----- */
  function makeTile(it, idx) {
    var li = document.createElement("li");
    li.className = "tile" + (selected.has(it.file) ? " selected" : "");

    var thumb = document.createElement("button");
    thumb.type = "button";
    thumb.className = "thumb";
    thumb.setAttribute("aria-label", it.title + " 크게 보기");
    var img = document.createElement("img");
    img.src = it.thumbUrl;
    img.alt = it.title;
    img.loading = "lazy";
    img.decoding = "async";
    thumb.appendChild(img);
    thumb.addEventListener("click", function () { openViewer(idx); });

    var pick = document.createElement("label");
    pick.className = "pick";
    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = selected.has(it.file);
    cb.setAttribute("aria-label", it.title + " 선택");
    cb.addEventListener("change", function () {
      if (cb.checked) selected.add(it.file); else selected.delete(it.file);
      li.classList.toggle("selected", cb.checked);
      updateSelBar();
    });
    pick.appendChild(cb);

    var cap = document.createElement("div");
    cap.className = "cap";
    var name = document.createElement("span");
    name.className = "name";
    name.textContent = it.title;
    var a = document.createElement("a");
    a.className = "dl";
    a.href = it.url;
    a.download = it.file;
    a.setAttribute("aria-label", it.title + " 다운로드");
    a.title = "다운로드";
    a.innerHTML = DL_ICON;
    cap.appendChild(name);
    cap.appendChild(a);

    li.appendChild(thumb);
    li.appendChild(pick);
    li.appendChild(cap);
    return li;
  }

  function render() {
    var q = state.q.trim().toLowerCase();
    view = items.filter(function (it) {
      if (state.category && it.category !== state.category) return false;
      if (state.color && it.color !== state.color) return false;
      if (state.tag && it.tags.indexOf(state.tag) < 0) return false;
      if (!q) return true;
      return (it.title + " " + it.category + " " + it.color + " " + it.tags.join(" ") + " " + it.file)
        .toLowerCase().indexOf(q) >= 0;
    });

    grid.replaceChildren.apply(grid, view.map(makeTile));

    var filtering = state.category || state.color || state.tag || q;
    countEl.textContent = filtering ? "검색 결과 " + view.length + "개" : "이미지 " + items.length + "개";
    $("#zipAll").hidden = !items.length;

    if (!items.length) {
      emptyEl.hidden = false;
      emptyEl.innerHTML =
        "<strong>아직 이미지가 없어요.</strong><br>" +
        "<code>images</code> 폴더에 이미지를 넣고 <code>python make_manifest.py</code> 를 실행하면 여기에 나타나요.";
    } else if (!view.length) {
      emptyEl.hidden = false;
      emptyEl.textContent = "조건에 맞는 이미지가 없어요. 검색어를 지우거나 다른 태그를 골라보세요.";
    } else {
      emptyEl.hidden = true;
    }
  }

  function updateSelBar() {
    var n = selected.size;
    selbar.hidden = n === 0;
    selTxt.textContent = n + "개 선택됨";
  }

  /* ----- 뷰어 ----- */
  function fillViewer() {
    var it = view[cur];
    if (!it) return;
    vImg.src = it.url;
    vImg.alt = it.title;
    vTitle.textContent = it.title;
    vMeta.textContent = (cur + 1) + " / " + view.length;
    vTags.textContent = [it.category, it.color].filter(Boolean).join(" · ") +
      (it.tags.length ? "   " + it.tags.map(function (x) { return "#" + x; }).join(" ") : "");
    vDl.href = it.url;
    vDl.setAttribute("download", it.file);
    vImg.onload = function () {
      vMeta.textContent =
        (cur + 1) + " / " + view.length + "  ·  " + vImg.naturalWidth + " × " + vImg.naturalHeight + "px";
    };
  }
  function openViewer(i) {
    cur = i;
    fillViewer();
    if (!dlg.open) dlg.showModal();
  }
  function step(d) {
    if (!view.length) return;
    cur = (cur + d + view.length) % view.length;
    fillViewer();
  }

  $("#vPrev").addEventListener("click", function () { step(-1); });
  $("#vNext").addEventListener("click", function () { step(1); });
  $("#vClose").addEventListener("click", function () { dlg.close(); });
  dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.close(); });
  dlg.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
    if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
  });

  /* ----- 이벤트 ----- */
  qEl.addEventListener("input", function () { state.q = qEl.value; render(); });

  $("#zipAll").addEventListener("click", function (e) {
    makeZip(items, "cubic-images-all.zip", e.currentTarget);
  });
  $("#selZip").addEventListener("click", function (e) {
    var list = items.filter(function (it) { return selected.has(it.file); });
    makeZip(list, "cubic-images-" + list.length + ".zip", e.currentTarget);
  });
  $("#selClear").addEventListener("click", function () {
    selected.clear();
    updateSelBar();
    render();
  });

  buildFilters();
  render();
})();
</script>
</body>
</html>
